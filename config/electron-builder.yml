# electron-builder 打包配置（package.json 的 dist 脚本用 --config 指回本文件）。
# 产物进 dist/（已 gitignore）。P5 再补：代码签名、自动更新（electron-updater）。

appId: com.gazer.jiushililu
productName: 九十里路

directories:
  output: dist

# 打包内容：正面列出构建产物（防 .gitignore 类过滤误伤），排除源码与本机目录；
# 生产依赖由 electron-builder 自动裁剪（zod 在 devDeps，已被 vite 打进 bundle，无需外置）；
# 图标走 extraResources 放到 asar 外（窗口图标用 process.resourcesPath 取）。
files:
  - 'out/**'
  - '!src/**'
  - '!tests/**'
  - '!config/**'
  - '!docs/**'
  - '!scripts/**'
  - '!resources/**'
  - '!{README.md,AGENTS.md,CLAUDE.md,.gitattributes,.npmrc,.prettierrc.json}'
  - '!{NOTEBOOK,PLAN,DIARY,.workbuddy,.github}/**'

# ⚠️ 原生二进制（node-pty 的 .node / conpty.dll / winpty-agent.exe）**必须解包到 asar 外**：
# 它们是操作系统直接加载的，打进 asar 后 Node 的 `process.dlopen` 找不到 —— 症状是"开发态
# 一切正常、打包版一开终端就报模块加载失败"（`scripts/verify-asar.cjs` 有对应检查兜底）。
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/*.node'

# ⚠️ 必须关掉"为 Electron ABI 重编原生模块"（2026-09-13 实测踩到）：默认 true 会对每个原生依赖
# 跑 node-gyp rebuild，而本机没有 Visual Studio 工具链 → 打包直接失败（`Could not find any
# Visual Studio installation to use` / `node-gyp failed to rebuild … node-pty`）。
# 关掉是安全的：node-pty 1.1.0 走 N-API 预编译，ABI 跨 Node/Electron 稳定（Electron 33 实测
# 零 rebuild 直接可用）；重编只会引入风险（要求用户装 VS 工具链，或产出行为不同的二进制）。
# ⚠️ 代价：将来引入**非 N-API** 的原生模块时，这一条必须重新评估。
npmRebuild: false

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/agents
    to: agents

win:
  icon: resources/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 九十里路

portable:
  artifactName: ${productName}-Portable-${version}.exe
