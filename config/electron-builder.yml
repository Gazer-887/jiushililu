# electron-builder 打包配置（位于 config/，package.json 的 dist 脚本用 --config 指回）
# 产物进 dist/（已 gitignore）。P5 再补：代码签名、自动更新（electron-updater）。

appId: com.gazer.jiushililu
productName: 九十里路

directories:
  output: dist

# 打包内容：正面包含构建产物（防 .gitignore 类过滤误伤），排除源码/本机目录；
# 生产依赖 node_modules 由 electron-builder 自动裁剪保留（zod 在 devDeps 会被 vite 打进 bundle，无需外置）。
# 图标走 extraResources 放到 asar 外（窗口图标用 process.resourcesPath 取）。
files:
  - 'out/**'
  - '!src/**'
  - '!tests/**'
  - '!config/**'
  - '!docs/**'
  - '!scripts/**'
  - '!resources/**'
  - '!{README.md,AGENTS.md,CLAUDE.md,.gitattributes,.npmrc,.prettierrc.json}'
  - '!{NOTEBOOK,PLAN,DIARY,.workbuddy,.github}/**'

extraResources:
  - from: resources/icon.ico
    to: icon.ico

win:
  icon: resources/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 九十里路

portable:
  artifactName: ${productName}-Portable-${version}.exe
