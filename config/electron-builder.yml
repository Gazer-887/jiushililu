# electron-builder 打包配置（位于 config/，package.json 的 dist 脚本用 --config 指回）
# 产物进 dist/（已 gitignore）。P5 再补：代码签名、自动更新（electron-updater）。

appId: com.gazer.jiushililu
productName: 九十里路

directories:
  output: dist

# 打包内容用"默认全含 + 排除"风格：生产依赖 node_modules 由 electron-builder 自动裁剪保留。
# 注意 DIARY/NOTEBOOK/PLAN 是本机目录，不排除会被塞进安装包。
files:
  - '!src/**'
  - '!tests/**'
  - '!config/**'
  - '!docs/**'
  - '!scripts/**'
  - '!{README.md,AGENTS.md,CLAUDE.md,.gitattributes,.npmrc,.prettierrc.json}'
  - '!{NOTEBOOK,PLAN,DIARY,.workbuddy,.github}/**'

win:
  icon: resources/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 九十里路

portable:
  artifactName: ${productName}-Portable-${version}.exe
