name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # CI 只做构建与测试，不需要下载 Electron 二进制（省 100MB+）
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      # plan8 R16：让 4 条「真实 ripgrep 端到端」测试在 CI 上真跑（此前一直 skipIf 跳过，
      # 这道门禁对 rg 相关改动等于没有）。用与 vendor 同源的 @vscode linux 包（版本钉死），
      # 再走既有 vendor 脚本复制（sha256 / chmod 逻辑全复用）；装不上则测试照旧显式 skip，不假绿。
      - name: 补齐随包 ripgrep（真二进制测试用）
        run: |
          node scripts/vendor-ripgrep.cjs || true
          if [ ! -f resources/ripgrep/rg ]; then
            npm i --no-save @vscode/ripgrep-linux-x64
            node scripts/vendor-ripgrep.cjs
          fi
          test -f resources/ripgrep/rg

      - name: 单元测试
        run: npm test
