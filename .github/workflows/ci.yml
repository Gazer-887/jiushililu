name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # CI 只做构建与测试，不需要下载 Electron 二进制（省 100MB+）
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      # plan8 R16：让 4 条「真实 ripgrep 端到端」测试在 CI 上真跑（此前一直 skipIf 跳过，
      # 这道门禁对 rg 相关改动等于没有）。用与 vendor 同源的 @vscode linux 包（版本钉死），
      # 再走既有 vendor 脚本复制（sha256 / chmod 逻辑全复用）；装不上则测试照旧显式 skip，不假绿。
      - name: 补齐随包 ripgrep（真二进制测试用）
        run: |
          node scripts/vendor-ripgrep.cjs || true
          if [ ! -f resources/ripgrep/rg ]; then
            npm i --no-save @vscode/ripgrep-linux-x64
            node scripts/vendor-ripgrep.cjs
          fi
          test -f resources/ripgrep/rg

      - name: 单元测试
        run: npm test

  # ── plan48 S2 · e2e（R6 进 CI）──────────────────────────────────────────
  # 独立 job，不复用 quality：它设了 `ELECTRON_SKIP_BINARY_DOWNLOAD: 1`（省 100MB），
  # 而 e2e 必须**有** Electron 可执行文件才能起。
  #
  # ⚠️ 这一步的首要目的是**量事实**，不是刷绿：plan8 R6 从 09-12 起就挂着"headless 可行性待评估"，
  #    一直没人实测。跑起来才知道 Linux runner 上 (a) Electron 能不能起 (b) `safeStorage`
  #    到底可不可用 —— 后者决定"发消息→流式上屏"这条主干能不能进 CI（见 plan48 §二方案 A/B）。
  #    所以这里**不加 continue-on-error**：红就是要看得见，红了日志里也有我们要的答案。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 装 Electron 缺的系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libdrm2 libgbm1 libasound2t64 libcups2 libxkbcommon0

      - name: 安装依赖（这次**不**跳过 Electron 二进制）
        run: npm ci

      - name: 构建（e2e 驱动真入口 out/，没有 dev server 兜底）
        run: npm run build

      - name: e2e S0 可行性主干
        # X 由 xvfb-run 自己挑空闲显示号并导出 DISPLAY，故不在 job.env 里写死 :99
        # （写死等于赌那个号没被占，多一个没必要失败模式）。
        run: xvfb-run --auto-servernum npx playwright test --config config/playwright.config.ts

  # ── plan53 D-5 · 真渲染门禁进 CI ──────────────────────────────────────────
  # `scripts/verify-shot.cjs` 是第五道闸：自建窗口 + 自建 IPC 桩，跑 399 条界面判据。
  # 此前只在各端本机跑，换端改界面没有任何东西会红（plan54 那族"接上了没人验"的同源问题）。
  #
  # 可行性是**实测定论**的（09-23，本机 Docker `node:22-bookworm`）：Linux 首轮 399 条里红 2，
  # 两条都在门禁脚本自己身上（拿盘符正则冒充绝对路径），已按真源 `isAbsolute` 修（`d8e26e6`）；
  # 修后 **Windows 399/0 ‖ Linux 容器 399/0**，容器一轮 3m12s ⇒ 超时按 15m 给，留一倍余量给冷启动。
  gate-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # apt 清单**照抄 e2e job 那份 + 只加中文字体**：e2e 已在同一 runner 上跑通真 Electron，
      # 说明其余运行库与 `xauth` runner 镜像自带（本机裸 Debian 探针要装 18 项，那是镜像差异不是需求差异）。
      # `fonts-noto-cjk` 不能省 —— runner 默认无中文字体，中文换行/裁切一变，吃几何量的判据就会假红。
      - name: 装 Electron 系统库 + 中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0 libdrm2 libgbm1 libasound2t64 libcups2 libxkbcommon0 \
            fonts-noto-cjk

      - name: 安装依赖（要 Electron 二进制，故不设 ELECTRON_SKIP_BINARY_DOWNLOAD）
        run: npm ci

      - name: 构建（门禁驱动 out/ 产物，没有 dev server 兜底）
        run: npm run build

      # ⚠️ `--no-sandbox` 是**首轮实测逼出来的**（run 35827699762）：不加就是
      #    `FATAL:setuid_sandbox_host.cc` —— chrome-sandbox 要 root:root + SUID 4755，
      #    npm 解包出来的二进制在 runner 上拿不到这个位，与"是不是 root 用户"无关。
      #    上一版这里写的依据（"e2e 同条件已能起 Electron ⇒ 不用关沙箱"）**是反的**：
      #    Playwright 起 electron 时默认就往参数里塞 `--no-sandbox`
      #    （`playwright-core/lib/coreBundle.js`：`if (!options.chromiumSandbox && …) unshift('--no-sandbox')`），
      #    所以 e2e 的"同条件"本身就已经含关沙箱 —— 要与 e2e 对齐，反而必须显式加这个开关。
      #    沙箱状态不是任何一条判据的标的，两边都关 ⇒ 口径仍然一致。
      # 红了就红：`reportAndExit` 有任何一条不匹配就 exit(1)，job 跟着失败（不加 continue-on-error）。
      - name: 真渲染门禁（399 条界面判据）
        run: xvfb-run --auto-servernum npx electron --no-sandbox scripts/verify-shot.cjs

      # 判据本身只给读数与名字，"到底长什么样"在截图里 —— 只在失败时上传，绿的时候没必要留产物。
      # 路径照脚本的 `SHOTS = join(process.cwd(), 'Photo')`，不是 `shots/`；
      # 且这里刻意用 `error`：路径写错必须响，用 `ignore` 会把"产物根本没落对地方"吞成静默。
      - name: 失败时留截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-shot-failure
          path: Photo/*.png
          if-no-files-found: error
          retention-days: 7

